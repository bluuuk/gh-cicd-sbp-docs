"code-security/how-tos/report-and-fix-vulnerabilities/fix-reported-vulnerabilities/publishing-a-repository-security-advisory.md":
    extractions:
      - extraction_class: "security_advice"
        extraction_text: |
          When you publish a security advisory, you notify your community about the security vulnerability that the security advisory addresses. Publishing a security advisory makes it easier for your community to update package dependencies and research the impact of the security vulnerability.
        attributes:
          type: "textual"
      - extraction_class: "security_advice"
        extraction_text: |
          > \[!WARNING]
          > Whenever possible, you should always add a fix version to a security advisory prior to publishing the advisory. If you don't, the advisory will be published without a fixed version, and Dependabot will alert your users about the issue, without offering any safe version to update to.
        attributes:
          type: "textual"
"actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications.md":
    extractions:
      - extraction_class: "security_advice"
        extraction_text: |
          To use your certificate and provisioning profile on a runner, we strongly recommend that you use GitHub secrets. For more information on creating secrets and using them in a workflow, see [Using secrets in GitHub Actions](/en/actions/security-guides/using-secrets-in-github-actions).
        attributes:
          type: "textual"
      - extraction_class: "security_advice"
        extraction_text: |
          On self-hosted runners, the `$RUNNER_TEMP` directory is cleaned up at the end of the job execution, but the keychain and provisioning profile might still exist on the runner.

          If you use self-hosted runners, you should add a final step to your workflow to help ensure that these sensitive files are deleted at the end of the job.
        attributes:
          type: "textual"
