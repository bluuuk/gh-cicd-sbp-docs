"code-security/concepts/secret-security/about-bypass-requests-for-push-protection.md":
    extractions:
      - extraction_class: "security_advice"
        extraction_text: |
          If you are a designated reviewer, you must review bypass requests and either approve or deny them based on the request details and your organization's security policies.
        attributes:
          type: "textual"
      - extraction_class: "security_advice"
        extraction_text: |
