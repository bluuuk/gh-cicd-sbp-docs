"code-security/reference/supply-chain-security/dependabot-errors.md":
    extractions:
      - extraction_class: "security_advice"
        extraction_text: |
          When an ecosystem has a deep and complex dependency graph, for example, npm and RubyGems, it is often impossible to upgrade a single dependency without upgrading the whole ecosystem.

          The best way to avoid this problem is to stay up to date with the most recently released versions, for example, by enabling version updates. This increases the likelihood that a vulnerability in one dependency can be resolved by a simple upgrade that doesn't break the dependency graph.
        attributes:
          type: "textual"   
